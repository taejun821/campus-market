spring.application.name=campus-market
server.port=8081

firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}

university.email.domains=ac.kr

# CORS - 허용할 프론트엔드 도메인 (쉼표로 구분)
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8080

# JWT - 프로덕션에서는 반드시 JWT_SECRET 환경변수 설정
jwt.secret=${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS1qd3Qtc2VjcmV0LWtleS1mb3ItY2FtcHVzLW1hcmtldC1hcHAhISE=}
jwt.expiration=86400000

# Firebase Storage (Firebase 콘솔 > Storage에서 확인: your-project.appspot.com)
firebase.storage.bucket=${FIREBASE_STORAGE_BUCKET:your-project.appspot.com}

# 이미지 업로드 최대 크기
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB